      templates:
        - delay_days: 0
          subject: Next steps for “{{deal_title}}”
          body: |
            Hi {{user_name}},

            Thank you for spending time in the “{{deal_title}}” AI deal.

            We prepared next steps based on what you reviewed.
            Use the buttons below to discuss a contract or talk with our team.
          include_sales_call_link: true
          include_contract_link: true
        - delay_days: 3
          subject: We can help you roll out “{{deal_title}}”
          body: |
            Hi {{user_name}},

            Thanks again for joining the AI deal.
            Our team can walk you through timing and how to use it.
          include_sales_call_link: true
          include_contract_link: true
        - delay_days: 7
          subject: How is your evaluation of {{deal_title}} going?
          body: |
            Hi {{user_name}},

            A week has passed since your AI deal.
            We can suggest a next step that matches where you are now.
          include_sales_call_link: true
          include_contract_link: false
        - delay_days: 15
          subject: Material to help you decide on “{{deal_title}}”
          body: |
            Hi {{user_name}},

            It has been about two weeks since you looked at “{{deal_title}}”.
            Our team can share details to support your decision.
          include_sales_call_link: true
          include_contract_link: true
        - delay_days: 30
          subject: Checking in on timing for “{{deal_title}}”
          body: |
            Hi {{user_name}},

            About a month has passed since the AI deal.
            When the timing is right, we can help with next steps.
          include_sales_call_link: true
          include_contract_link: true
